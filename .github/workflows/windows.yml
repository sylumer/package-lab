# Windows check. Added in E6.3. It runs the suite and the UI tests on a Windows runner, builds the portable zip and
# uploads it. Release downloads are built on the Mac (make release); this zip is the one a signing service would sign.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No .nvmrc or engines field in the repo; the README asks for Node.js 20 or later. 22 is an LTS line.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests check written zips with `unzip -t` (test/test.js: unzipT), so Info-ZIP comes from Chocolatey.
      - name: Install Info-ZIP
        run: choco install zip unzip -y

      - name: Unit tests
        run: node test/test.js --unit

      # The runner's screen is 1024x768, smaller than the 1100x800 run window, so Windows shrinks the window and the tests'
      # clicks (fractions of the window, measured on the sample at full size) miss. A 1920x1080 screen keeps the full size.
      - name: Screen size
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary

      - name: Full suite
        run: npm test

      # Frames and sizes around the live test's click (test/test.js keeps them on GitHub Actions).
      - name: Upload live-test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-diagnostics
          path: dist/diag/
          if-no-files-found: ignore

      # Runs even when a test failed, so the first run still gives a build and a UI result.
      - name: Build the portable Windows zip
        if: ${{ !cancelled() }}
        run: node scripts/package.js --platform win32

      - name: Upload the zip
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-lab-win32
          path: dist/*.zip
          if-no-files-found: error

      # The UI tests' web checks drive Playwright's own Chromium. Run even when a test failed, so the UI result is reported.
      - name: Install Chromium for the UI tests
        if: ${{ !cancelled() }}
        run: npx playwright install chromium

      - name: UI tests
        if: ${{ !cancelled() }}
        run: npm run test:ui
