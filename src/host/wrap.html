<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LMS frame</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><script>
// An empty LMS frame between the API's window and the content: #<frames left>|<content URL>.
const [n, url] = decodeURIComponent(location.hash.slice(1)).split(/\|(.*)/s)
const f = document.createElement('iframe')
f.src = +n > 1 ? 'wrap.html#' + encodeURIComponent((n - 1) + '|' + url) : url
document.body.append(f)
</script></body></html>
